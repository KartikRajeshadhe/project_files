<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Withdraw</title>
    <style>
        body{
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:url(https://media.istockphoto.com/id/1381637603/photo/mountain-landscape.jpg?s=612x612&w=0&k=20&c=w64j3fW8C96CfYo3kbi386rs_sHH_6BGe8lAAAFS-y4=) ;
        background-repeat: no-repeat;
    background-size: cover;
 
        }
        .container{
            width: 30%;
            height: 80%;
            box-shadow: 5px 5px 50px 3px rgb(153, 147, 147);
            background-color: white;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
       
               img{
            width: 80%;
            height: 100%;
           
        }
        .btn-grp{
            width: 90%;
            height: 30%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;
        }
        button{
            width: 150px;
            height: 50px;
            border-radius: 10px;
            border: none;
            font-size: 25px;
        }
        button:hover{
            background-color:orange;
        }
        .display{
            background-color: darkcyan;
            display: flex;
        }
        input{
            height: 70%;
            width: 130%;
        }
        button{
            background-color: black;
            color: red;
        }

    </style>
</head>
<body>
     <div class="container">

        <p id="display"></p>
        <p id="display-2"></p>
        <button onclick="getMoney()">Get Money</button>
        <script>


            let Kartik = 10000
            document.getElementById("display").innerHTML = Kartik

            let Adhe = 0
            function getMoney() {
                Adhe = prompt("Enter amount")
                Kartik = Kartik - Number(Adhe)
                document.getElementById("display-2").innerHTML = Kartik
            }



        </script>
    </div>
</body>
</html>

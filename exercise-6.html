</head>
<body>
    <p id="display">0</p>
    <button onclick="increment()">
Increment
</button>
<button onclick="decrement()">Decrement</button>
    <script>
        let count =0
        //count = count=10;
        function Increment(){
            count++;
            document.getElementById("display").innerHTML.count;
        }
        function Decrement(){
            count--;
            document.getElementById("display").innerHTML.count
        }
    </script>
</body>

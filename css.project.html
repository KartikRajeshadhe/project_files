        body {

}

header {
    background-color: #1f2833;
    text-align: center;
    padding: 20px;  font-family: cursive;
}

h1 {
    margin: 0;
    color: #66fcf1;  font-family: cursive;
}

main {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;  font-family: cursive;
}
button{

    color: orange;
    background-color: black;  font-family: cursive;
}
.Project {
    background-color: #2c3e50;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    transition: transform 0.3s ease;  font-family: cursive;
}

.Project:hover {
    transform: scale(1.05);
}

.Project img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 10px;
}

footer {
    background-color: #2e3d4e;
    text-align: center;
    padding: 10px;  font-family: cursive;
}

    <body>
        <fieldset>
            <h1> Checker</h1>
            <p id="display"></p>
            <input type="number" id="xyz" placeholder="Enter side">
            <input type="number" id="abc" placeholder="Enter side">
                <input type="number" id="hkh" placeholder="Enter side">
            <button onclick="triangle()">cheak</button>

            <script>
                function triangle() {
                    let side = Number(document.getElementById("xyz").value);
                    let k = Number(document.getElementById("abc").value);
                    let h = Number(document.getElementById("hkh").value);
                    if (side==k && k == h) {
                        document.getElementById("display").innerHTML = "equilateral";


                    }
                    else if (side == k || k==h  ||  side==h ) {
                        document.getElementById("display").innerHTML = "iscoscluse";
                    }

                    else{
                        document.getElementById("display").innerHTML = "scalene";
                    }

                
                }

            </script>
        </fieldset>

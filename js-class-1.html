<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .card {
            width: 40%;
            height: 50%;

        }

        .card-img {
            width: 80%;
            height: 70%;
            background-color: bisque;

        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .button-group {
            width: 80%;
            height: 20%;
            background-color: rgb(20, 224, 224);
            justify-content: center;
            text-align: center;
            flex-wrap: wrap;
        }
        button{
            width: 100px;
            height: 50px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-img">
            <img src="https://www.explore.com/img/gallery/cool-pictures-of-nature-around-the-world/intro-1674582389.jpg" alt="" id="image">
        </div>
        <div class="button-group">
            <button onclick="imageOne()" >Change</button>
            <button onclick="imageTwo()">Change</button>
        </div>
    </div>
    <script>
        function imageOne() {
            document.getElementById("image").src="https://thumbs.dreamstime.com/b/landscape-sky-full-moon-seascape-to-night-serenity-nature-beautiful-view-sea-many-stars-attractive-dark-cloud-141554532.jpg"
        }
         function imageTwo() {
            document.getElementById("image").src="https://i.pinimg.com/736x/e7/d3/71/e7d371791532c5e6d8b74bb27a13b62d.jpg"
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Animation</title>
  <style>
    /* Basic setup */
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(ellipse at center, #000010 0%, #000 100%);
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .solar-system {
      position: relative;
      width: 700px;
      height: 700px;
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, #ffec85, #ffb400);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 60px 30px rgba(255, 204, 0, 0.5);
      z-index: 10;
    }

    /* Orbits */
    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: rotate linear infinite;
    }

    /* Planet */
    .planet {
      position: absolute;
      top: 0;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* Each planet with size, color, orbit size, and speed */
    .mercury-orbit { width: 130px; height: 130px; animation-duration: 10s; }
    .mercury { width: 8px; height: 8px;  }

    .venus-orbit { width: 180px; height: 180px; animation-duration: 18s; }
    .venus { width: 14px; height: 14px; }

    .earth-orbit { width: 240px; height: 240px; animation-duration: 25s; }
    .earth { width: 16px; height: 16px;  }

    .mars-orbit { width: 300px; height: 300px; animation-duration: 32s; }
    .mars { width: 12px; height: 12px; ; }

    .jupiter-orbit { width: 370px; height: 370px; animation-duration: 50s; }
    .jupiter { width: 28px; height: 28px;  }

    .saturn-orbit { width: 450px; height: 450px; animation-duration: 65s; }
    .saturn { width: 24px; height: 24px;  }

    .uranus-orbit { width: 520px; height: 520px; animation-duration: 80s; }
    .uranus { width: 20px; height: 20px;  }

    .neptune-orbit { width: 590px; height: 590px; animation-duration: 95s; }
    .neptune { width: 18px; height: 18px;  }

    /* Rotation animation */
  

    /* Optional: Add labels */
    .label {
      position: absolute;
      color: white;
      font-size: 10px;
      text-align: center;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

  </style>
</head>
<body>
  <div class="solar-system">
    <div class="sun"></div>

    <div class="orbit mercury-orbit">
      <div class="planet mercury"></div>
    </div>

    <div class="orbit venus-orbit">
      <div class="planet venus"></div>
    </div>

    <div class="orbit earth-orbit">
      <div class="planet earth"></div>
    </div>

    <div class="orbit mars-orbit">
      <div class="planet mars"></div>
    </div>

    <div class="orbit jupiter-orbit">
      <div class="planet jupiter"></div>
    </div>

    <div class="orbit saturn-orbit">
      <div class="planet saturn"></div>
    </div>

    <div class="orbit uranus-orbit">
      <div class="planet uranus"></div>
    </div>

    <div class="orbit neptune-orbit">
      <div class="planet neptune"></div>
    </div>
  </div>
</body>
</html>

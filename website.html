<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planets of the Solar System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #0b0c10;
    color: #ffffff;
    margin: 0;
    padding: 0;
}

header {
    background-color: #1f2833;
    text-align: center;
    padding: 20px;
}

h1 {
    margin: 0;
    color: #66fcf1;
}

main {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}

.planet {
    background-color: #2c3e50;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    transition: transform 0.3s ease;
}

.planet:hover {
    transform: scale(1.05);
}

.planet img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 10px;
}

footer {
    background-color: #1f2833;
    text-align: center;
    padding: 10px;
}

    </style>
</head>

    <header>
        <h1>Planets of the Solar System</h1>
    </header>

        <section class="planet">

        </section>

        <section class="planet">
            <img src="" alt="Jupiter">
            <a href=""></a>
        </section>

        <section class="planet">
            <img src="" alt="Saturn">
            <a href=""></a>
        </section>

        <section class="planet">
            <img src="" alt="Uranus">

</html>
